<title>Did the Context Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ── Tokens: complete light palette on bare :root ─────────────────────────── */
:root {
  --paper:      #EFF2F1;
  --surface:    #FFFFFF;
  --surface-2:  #E4E9E7;
  --ink:        #17211F;
  --ink-2:      #475854;
  --ink-3:      #6F817C;
  --rule:       #CFD8D5;
  --rule-soft:  #E0E6E4;

  --baseline:   #52707A;   /* the arm written without the plan  */
  --adapted:    #A66A14;   /* the arm written with it           */
  --confirmed:  #1E6B58;   /* landed where it aimed             */
  --flag:       #9E4E1A;   /* landed somewhere else             */
  --miss:       #8C2F2F;   /* did not land at all               */
  --quiet:      #7A8B86;   /* unchanged / noise                 */

  --adapted-soft:   #F4E8D4;
  --confirmed-soft: #DCEAE4;
  --flag-soft:      #F3E3D6;
  --miss-soft:      #F2DEDE;

  --shadow: 0 1px 2px rgba(23,33,31,.06), 0 8px 24px -12px rgba(23,33,31,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0E1413;
    --surface:    #161E1C;
    --surface-2:  #1E2825;
    --ink:        #E6ECE9;
    --ink-2:      #A8B7B2;
    --ink-3:      #7C8D88;
    --rule:       #2A3733;
    --rule-soft:  #212C29;

    --baseline:   #8FB2BC;
    --adapted:    #E0A44D;
    --confirmed:  #5FBFA1;
    --flag:       #DC9256;
    --miss:       #E08585;
    --quiet:      #6E807B;

    --adapted-soft:   #33260F;
    --confirmed-soft: #123028;
    --flag-soft:      #33220F;
    --miss-soft:      #331A1A;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --paper:      #0E1413;
  --surface:    #161E1C;
  --surface-2:  #1E2825;
  --ink:        #E6ECE9;
  --ink-2:      #A8B7B2;
  --ink-3:      #7C8D88;
  --rule:       #2A3733;
  --rule-soft:  #212C29;

  --baseline:   #8FB2BC;
  --adapted:    #E0A44D;
  --confirmed:  #5FBFA1;
  --flag:       #DC9256;
  --miss:       #E08585;
  --quiet:      #6E807B;

  --adapted-soft:   #33260F;
  --confirmed-soft: #123028;
  --flag-soft:      #33220F;
  --miss-soft:      #331A1A;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px 96px; }

h1, h2, h3, .display {
  font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  text-wrap: balance;
  margin: 0;
}
.mono, .num {
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ── Masthead ─────────────────────────────────────────────────────────────── */
.masthead { border-bottom: 1px solid var(--rule); background: var(--surface); }
.masthead-inner { max-width: 1180px; margin: 0 auto; padding: 30px 28px 26px; }
.eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 12px;
}
h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.06; }
.standfirst {
  margin-top: 12px; max-width: 60ch; color: var(--ink-2); font-size: 17px;
}
.runline {
  margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--rule-soft);
  display: flex; flex-wrap: wrap; gap: 8px 26px;
  font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3);
}
.runline b { color: var(--ink-2); font-weight: 500; }

/* ── Verdict tiles ────────────────────────────────────────────────────────── */
.tiles {
  display: grid; gap: 14px; margin: 30px 0 8px;
  grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
}
.tile {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 4px; padding: 16px 18px 15px;
  border-top: 3px solid var(--tile-accent, var(--quiet));
}
.tile .n {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 34px; font-weight: 600; line-height: 1;
  color: var(--tile-accent, var(--ink));
}
.tile .k {
  margin-top: 9px; font-family: "IBM Plex Mono", monospace;
  font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
}
.tile .sub { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.t-hand      { --tile-accent: var(--adapted); }
.t-confirmed { --tile-accent: var(--confirmed); }
.t-flag      { --tile-accent: var(--flag); }
.t-miss      { --tile-accent: var(--miss); }

/* ── The caveat panel ─────────────────────────────────────────────────────── */
.caveat {
  margin: 26px 0 0; padding: 18px 20px;
  background: var(--surface-2); border-left: 3px solid var(--baseline);
  border-radius: 0 4px 4px 0;
}
.caveat h3 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.caveat p { margin: 8px 0 0; font-size: 14.5px; color: var(--ink-2); max-width: 74ch; }
.caveat .mono { color: var(--ink); font-size: 13px; }

/* ── Topics ───────────────────────────────────────────────────────────────── */
.topic { margin-top: 42px; }
.topic-head {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-bottom: 12px; border-bottom: 2px solid var(--ink);
}
.topic-n {
  font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 600;
  color: var(--ink-3);
}
.topic-head h2 { font-size: 23px; font-weight: 700; letter-spacing: -.015em; }
.topic-target {
  flex-basis: 100%; margin-top: 7px; font-size: 14.5px; color: var(--ink-2);
}
.topic-target span {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
  margin-right: 8px;
}

.cols { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 26px; margin-top: 20px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.rail-h {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3);
  margin-bottom: 12px;
}

/* ── Adaptation cards ─────────────────────────────────────────────────────── */
.adapt {
  background: var(--surface); border: 1px solid var(--rule);
  border-left: 3px solid var(--st); border-radius: 0 4px 4px 0;
  padding: 14px 15px; margin-bottom: 12px;
}
.adapt.yes       { --st: var(--confirmed); }
.adapt.elsewhere { --st: var(--flag); }
.adapt.no, .adapt.noise-only { --st: var(--miss); }
.adapt.unplaced  { --st: var(--quiet); }

.adapt-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
.factor {
  font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
  letter-spacing: .04em; color: var(--ink);
}
.kind {
  font-family: "IBM Plex Mono", monospace; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
}
.chip {
  margin-left: auto;
  font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; white-space: nowrap;
}
.chip.yes       { background: var(--confirmed-soft); color: var(--confirmed); }
.chip.elsewhere { background: var(--flag-soft);      color: var(--flag); }
.chip.no, .chip.noise-only { background: var(--miss-soft); color: var(--miss); }
.chip.unplaced  { background: var(--surface-2);      color: var(--ink-3); }

.adapt .change { font-size: 15px; line-height: 1.5; }
.adapt .why {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule-soft);
  font-size: 13.5px; color: var(--ink-2);
}
.adapt .why b {
  font-family: "IBM Plex Mono", monospace; font-size: 9.5px; font-weight: 600;
  letter-spacing: .11em; text-transform: uppercase; color: var(--ink-3);
  display: block; margin-bottom: 3px;
}
.evidence { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.evidence code {
  font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
  background: var(--surface-2); color: var(--ink-2);
  padding: 2px 6px; border-radius: 2px;
}
.aimed {
  margin-top: 9px; font-family: "IBM Plex Mono", monospace; font-size: 11px;
  color: var(--ink-3);
}
.aimed b { color: var(--ink-2); font-weight: 500; }

.none-here {
  background: var(--surface-2); border: 1px dashed var(--rule);
  border-radius: 4px; padding: 15px; font-size: 14.5px; color: var(--ink-2);
}

/* ── Section strip ────────────────────────────────────────────────────────── */
.strip { display: flex; flex-direction: column; gap: 2px; }
.sec {
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
  padding: 11px 14px; display: grid;
  grid-template-columns: 108px 1fr 96px 68px; align-items: center; gap: 14px;
  font: inherit; color: inherit;
}
.sec:hover { border-color: var(--ink-3); }
.sec:focus-visible { outline: 2px solid var(--adapted); outline-offset: 2px; }
.sec[aria-expanded="true"] { border-color: var(--ink); }
.sec[disabled] { cursor: default; opacity: .72; }
.sec[disabled]:hover { border-color: var(--rule); }

.sec-name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 14px; }
.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fill, var(--quiet)); border-radius: 99px; }
.sec.moved  { --fill: var(--adapted); }
.sec.noise  { --fill: var(--quiet); }
.sec-state {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
}
.sec.moved .sec-state { color: var(--adapted); }
.sec-sim {
  font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
  font-size: 12px; color: var(--ink-3); text-align: right;
}
@media (max-width: 620px) {
  .sec { grid-template-columns: 1fr auto; }
  .bar, .sec-sim { display: none; }
}

/* ── Diff ─────────────────────────────────────────────────────────────────── */
.diff { display: none; margin: 2px 0 8px; }
.diff.open { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
@media (max-width: 760px) { .diff.open { grid-template-columns: 1fr; } }
.pane { background: var(--surface); border: 1px solid var(--rule); padding: 14px 16px 16px; }
.pane h4 {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; margin: 0 0 10px;
  padding-bottom: 8px; border-bottom: 1px solid var(--rule-soft);
}
.pane.a h4 { color: var(--baseline); }
.pane.b h4 { color: var(--adapted); }
.pane p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
.pane mark {
  background: var(--adapted-soft); color: var(--ink);
  padding: 1px 2px; border-radius: 2px;
}
.pane.a mark { background: var(--surface-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }

.foot {
  margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule);
  font-size: 13.5px; color: var(--ink-3); max-width: 76ch;
}
.foot code { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="masthead">
  <div class="masthead-inner">
    <div class="eyebrow">Node 2 &rarr; Generation &nbsp;·&nbsp; A/B comparison</div>
    <h1 id="title">Did the context land?</h1>
    <p class="standfirst" id="standfirst"></p>
    <div class="runline" id="runline"></div>
  </div>
</header>

<div class="wrap">
  <section class="tiles" id="tiles"></section>
  <div id="caveats"></div>
  <main id="topics"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LANDED_LABEL = {
  yes:         "landed",
  elsewhere:   "not where aimed",
  "noise-only":"noise only",
  no:          "did not land",
  unplaced:    "no section named",
};

/* ── Masthead ──────────────────────────────────────────────────────────── */
const m = DATA.meta || {}, s = DATA.summary || {};
document.getElementById("standfirst").textContent =
  `The same chapter written twice — once from Node 1's contract alone, once with `
  + `Node 2's context plan added. Everything else was held identical, so any `
  + `difference below is the plan's doing.`;

document.getElementById("runline").innerHTML = [
  `<span>Grade <b>${esc(m.grade)}</b> ${esc(m.subject)}</span>`,
  `<span>Chapter ${esc(m.chapterNumber)} · <b>${esc(m.chapter)}</b></span>`,
  `<span>contract <b>${esc((m.contractFingerprint||"").slice(0,12))}</b></span>`,
  `<span>noise arm <b>${DATA.noiseArmRan ? "ran" : "NOT RUN"}</b></span>`,
  m.sampleRun ? `<span><b>sample data</b> — not a live model run</span>` : "",
].filter(Boolean).join("");

/* ── Tiles ─────────────────────────────────────────────────────────────── */
const tiles = [
  ["t-hand",      s.adaptationsHandedOver, "handed to the generator",
   `across ${s.topics} topic${s.topics === 1 ? "" : "s"}`],
  ["t-confirmed", s.landedWhereAimed,      "landed where aimed",
   "the named section is genuinely different"],
  ["t-flag",      s.landedElsewhere,       "landed elsewhere",
   "the sheet moved, but not the section asked for"],
  ["t-miss",      s.didNotLand,            "did not land",
   "no trace in the section it named"],
];
document.getElementById("tiles").innerHTML = tiles.map(([cls, n, k, sub]) => `
  <div class="tile ${cls}">
    <div class="n">${n ?? "—"}</div>
    <div class="k">${esc(k)}</div>
    <div class="sub">${esc(sub)}</div>
  </div>`).join("");

/* ── Caveats: the two things a reader would otherwise assume ───────────── */
const caveats = [];
if (s.contextAdoptionConfirmed !== null && s.contextAdoptionConfirmed !== undefined
    && s.landedWhereAimed !== s.adaptationsHandedOver) {
  caveats.push(`<div class="caveat">
    <h3>Two measures disagree, and the stricter one is right</h3>
    <p>The word-overlap adoption check reports
    <span class="mono">${(s.contextAdoptionConfirmed*100).toFixed(0)}%</span> confirmed,
    because it searches the whole sheet and a paraphrase satisfies it. The section
    comparison is exact — it asks whether the section an adaptation <em>named</em>
    differs between two runs that varied by one input. Where the two disagree,
    read the section comparison.</p>
  </div>`);
}
if (!DATA.noiseArmRan) {
  caveats.push(`<div class="caveat">
    <h3>No noise arm ran, so there is no ruler</h3>
    <p>Generation runs at temperature 0.6 — two runs of the <em>same</em> arm differ.
    Without a second baseline to measure that wobble, a small change below cannot be
    told apart from the sampler. Re-run with the noise arm to draw the line.</p>
  </div>`);
}
document.getElementById("caveats").innerHTML = caveats.join("");

/* ── Topics ────────────────────────────────────────────────────────────── */
function diffHTML(sec) {
  const mark = (text, lines) => {
    let out = esc(text);
    (lines || []).forEach(l => {
      const e = esc(l);
      if (e && out.includes(e)) out = out.split(e).join(`<mark>${e}</mark>`);
    });
    return out;
  };
  return `
    <div class="pane a">
      <h4>Without the plan</h4>
      <p>${mark(sec.before, sec.removed) || "<em>empty</em>"}</p>
    </div>
    <div class="pane b">
      <h4>With Node 2's plan</h4>
      <p>${mark(sec.after, sec.added) || "<em>empty</em>"}</p>
    </div>`;
}

document.getElementById("topics").innerHTML = (DATA.topics || []).map((t, ti) => {
  const cards = (t.adaptations || []).length
    ? t.adaptations.map(a => `
        <article class="adapt ${esc(a.landed)}">
          <div class="adapt-top">
            <span class="factor">${esc(a.factor)}</span>
            <span class="kind">${esc(a.type)} · ${esc(a.purpose)}</span>
            <span class="chip ${esc(a.landed)}">${esc(LANDED_LABEL[a.landed] || a.landed)}</span>
          </div>
          <div class="change">${esc(a.change)}</div>
          <div class="why"><b>why</b>${esc(a.reason)}</div>
          ${(a.evidence || []).length ? `<div class="evidence">${
            a.evidence.map(e => `<code>${esc(e)}</code>`).join("")}</div>` : ""}
          <div class="aimed">aimed at <b>${esc(a.section || "no section")}</b></div>
        </article>`).join("")
    : `<div class="none-here">Node 2 proposed nothing for this topic — it judged the
       lesson already fits this room. That is a real answer, not a gap.</div>`;

  const strip = (t.sections || []).map((sec, si) => {
    const moved = sec.changed && (sec.aboveNoise !== false);
    const noiseOnly = sec.changed && sec.aboveNoise === false;
    const state = moved ? "rewritten" : noiseOnly ? "noise" : "identical";
    const pct = Math.round((1 - sec.similarity) * 100);
    const id = `d-${ti}-${si}`;
    return `
      <button class="sec ${moved ? "moved" : noiseOnly ? "noise" : ""}"
              aria-expanded="false" aria-controls="${id}"
              ${sec.changed ? "" : "disabled"}
              data-target="${id}">
        <span class="sec-name">${esc(sec.label)}</span>
        <span class="bar"><i style="width:${Math.max(pct, sec.changed ? 4 : 0)}%"></i></span>
        <span class="sec-state">${state}</span>
        <span class="sec-sim">${sec.changed ? pct + "% new" : "—"}</span>
      </button>
      <div class="diff" id="${id}">${sec.changed ? diffHTML(sec) : ""}</div>`;
  }).join("");

  return `
    <section class="topic">
      <div class="topic-head">
        <span class="topic-n">T${t.index}</span>
        <h2>${esc(t.topic || "")}</h2>
        <div class="topic-target"><span>must leave them able to</span>${esc(t.masteryTarget || "")}</div>
      </div>
      <div class="cols">
        <div>
          <div class="rail-h">What Node 2 asked for</div>
          ${cards}
        </div>
        <div>
          <div class="rail-h">What changed in the sheet</div>
          <div class="strip">${strip}</div>
        </div>
      </div>
    </section>`;
}).join("");

document.getElementById("foot").innerHTML =
  `Generated by <code>python -m generation.cli compare</code>. The baseline arm's prompt `
  + `is byte-identical to what generation produced before Node 2 existed — `
  + `<code>generation/reinforcement.py</code> contributes an empty string when there is `
  + `no plan — which is what lets a difference here be attributed to the plan rather `
  + `than to a prompt rewrite. Whether a landed change is an <em>improvement</em> is a `
  + `separate question, and one this page does not answer: that is Node 3's learner gate `
  + `and a teacher's judgement.`;

/* ── Interaction ───────────────────────────────────────────────────────── */
document.getElementById("topics").addEventListener("click", e => {
  const btn = e.target.closest(".sec");
  if (!btn || btn.disabled) return;
  const panel = document.getElementById(btn.dataset.target);
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  panel.classList.toggle("open", !open);
});
</script>
